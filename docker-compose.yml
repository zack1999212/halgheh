services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: halgheh
      POSTGRES_PASSWORD: halgheh
      POSTGRES_DB: halgheh
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halgheh"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./service
    command: >
      sh -c "alembic upgrade head &&
             uvicorn service.main:app --host 0.0.0.0 --port 8000"
    working_dir: /app
    volumes:
      - ./service:/app/service
      - ./alembic.ini:/app/alembic.ini
      - ./alembic:/app/alembic
    ports:
      - "8002:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Set SECRET_KEY in the host environment for non-development deployments.
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: postgresql+psycopg2://halgheh:halgheh@db:5432/halgheh
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./service
    command: python -m service.reminder_worker
    working_dir: /app
    volumes:
      - ./service:/app/service
      - ./alembic.ini:/app/alembic.ini
      - ./alembic:/app/alembic
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: postgresql+psycopg2://halgheh:halgheh@db:5432/halgheh
      REMINDER_SCHEDULING_HORIZON_DAYS: ${REMINDER_SCHEDULING_HORIZON_DAYS:-30}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-90}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
