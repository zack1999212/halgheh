services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: halgheh
      POSTGRES_PASSWORD: halgheh
      POSTGRES_DB: halgheh
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halgheh"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./service
    command: >
      sh -c "alembic upgrade heads &&
             uvicorn service.main:app --host 0.0.0.0 --port 8001"
    working_dir: /app
    volumes:
      - ./service:/app/service
      - ./alembic.ini:/app/alembic.ini
      - ./alembic:/app/alembic
    ports:
      - "8001:8001"
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Set SECRET_KEY in the host environment for non-development deployments.
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: postgresql+psycopg2://halgheh:halgheh@db:5432/halgheh
      # Application-wide AI provider defaults (see service/.env.example).
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-zai}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-glm-4.5-flash}
      AI_DEFAULT_API_KEY: ${AI_DEFAULT_API_KEY:-}
      AI_DEFAULT_BASE_URL: ${AI_DEFAULT_BASE_URL:-}
      AI_DEFAULT_EXTRA_CONFIG: ${AI_DEFAULT_EXTRA_CONFIG:-}
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:-}
      # AI agent execution limits (optional; the code has safe defaults).
      AGENT_MAX_TOOL_CALLS_PER_TURN: ${AGENT_MAX_TOOL_CALLS_PER_TURN:-8}
      AGENT_MAX_CONTEXT_MESSAGES: ${AGENT_MAX_CONTEXT_MESSAGES:-40}
      AGENT_PROVIDER_TIMEOUT_SECONDS: ${AGENT_PROVIDER_TIMEOUT_SECONDS:-60}
      AGENT_TOOL_TIMEOUT_SECONDS: ${AGENT_TOOL_TIMEOUT_SECONDS:-30}
      AGENT_MAX_TOOL_ARGUMENT_BYTES: ${AGENT_MAX_TOOL_ARGUMENT_BYTES:-10000}
      AGENT_MAX_TOOL_RESULT_BYTES: ${AGENT_MAX_TOOL_RESULT_BYTES:-50000}
      AGENT_PENDING_ACTION_TTL_SECONDS: ${AGENT_PENDING_ACTION_TTL_SECONDS:-900}
      # Confirmation policy for non-destructive agent actions (default: off).
      AGENT_CONFIRM_CREATE_EVENT: ${AGENT_CONFIRM_CREATE_EVENT:-false}
      AGENT_CONFIRM_UPDATE_EVENT: ${AGENT_CONFIRM_UPDATE_EVENT:-false}
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./service
    command: python -m service.reminder_worker
    working_dir: /app
    volumes:
      - ./service:/app/service
      - ./alembic.ini:/app/alembic.ini
      - ./alembic:/app/alembic
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: postgresql+psycopg2://halgheh:halgheh@db:5432/halgheh
      REMINDER_SCHEDULING_HORIZON_DAYS: ${REMINDER_SCHEDULING_HORIZON_DAYS:-30}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-90}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
